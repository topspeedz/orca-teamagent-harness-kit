<title>모델 선택 설문</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, a short intro, the table in its own scroll box, the save bar under it. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #1b2230; --muted: #5d6878; --line: #dde2ea;
  --accent: #2f55c8; --accent-fg: #ffffff; --new: #1f7a4d; --new-bg: #e3f3ea; --warn: #a3331f; --chip: #eef1f6;
  --font: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --surface: #1a2029; --fg: #e4e8ef; --muted: #98a3b3; --line: #2c3442;
  --accent: #7d9cff; --accent-fg: #0e1320; --new: #6fd3a0; --new-bg: #173226; --warn: #ff8a70; --chip: #232b37; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --fg: #e4e8ef; --muted: #98a3b3; --line: #2c3442;
  --accent: #7d9cff; --accent-fg: #0e1320; --new: #6fd3a0; --new-bg: #173226; --warn: #ff8a70; --chip: #232b37; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 20px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
.intro { color: var(--muted); margin: 6px 0 0; max-width: 65ch; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-size: 0.75rem; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
select, input[type="text"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 7.5em; }
select:disabled { color: var(--muted); background: var(--chip); border-style: dashed; }
.pill { display: inline-block; font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.pill.new { background: var(--new-bg); color: var(--new); font-weight: 600; }
.rec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.reason { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
button { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); padding: 8px 20px; font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
#status.ok { color: var(--new); font-weight: 600; }
#status.err { color: var(--warn); }
#fallback { display: grid; gap: 8px; }
textarea { width: 100%; box-sizing: border-box; min-height: 12em; font: 0.85rem/1.4 var(--mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
</style>

<main>
  <header>
    <h1>모델 선택 설문</h1>
    <p class="intro">작업 단위마다 쓸 model과 effort를 고르고 저장을 누르세요. 기존 줄은 지금 값이 그대로 골라져 있고, 추천은 옆에 참고로만 보입니다. haiku는 effort를 받지 않습니다.</p>
  </header>
  <div class="scroll">
    <table>
      <thead><tr><th>에이전트</th><th>작업 단위</th><th>런타임</th><th>model</th><th>effort</th><th>추천</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="bar">
    <button type="button" class="primary" id="save">저장</button>
    <span id="status" role="status"></span>
  </div>
  <div id="fallback" hidden>
    <label for="json">이 내용을 복사해 채팅에 붙여 넣어 주세요.</label>
    <textarea id="json" readonly></textarea>
    <div class="bar"><button type="button" id="copy">복사</button><span id="copied" role="status"></span></div>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;
const COLLECTION = 'model-selection', DOC_ID = 'choices';
// the same condition locks the effort select and clears it
const noEffort = (s) => s.runtime === 'claude' && s.model === 'haiku';
const state = DATA.rows.map((r) => ({ runtime: r.runtime, model: r.model, effort: noEffort(r) ? '' : r.effort }));
let touched = false;
const dbReady = window.claude && window.claude.use ? window.claude.use('db').catch(() => null) : Promise.resolve(null);

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  Object.assign(e, attrs || {});
  if (text !== undefined) e.textContent = text;
  return e;
}
// a value outside the list (an old notation, a pinned model ID) is added as an option, so it stays selected
function select(id, values, value, labels) {
  const s = el('select', { id });
  const all = values.includes(value) ? values : [...values, value];
  for (const v of all) s.append(el('option', { value: v }, (labels && labels[v]) || v));
  s.value = value;
  return s;
}
function td(...children) {
  const cell = el('td');
  cell.append(...children);
  return cell;
}
const recText = (rec) => `추천: ${rec.model}${rec.effort ? ' / ' + rec.effort : ''}`;

function render() {
  const body = document.getElementById('rows');
  body.replaceChildren();
  if (!document.getElementById('codex-models')) {
    const dl = el('datalist', { id: 'codex-models' });
    dl.append(...(DATA.codexModels ?? []).map((m) => el('option', { value: m })));
    document.body.append(dl);
  }
  DATA.rows.forEach((r, i) => {
    const s = state[i], tr = el('tr');
    tr.append(td(el('code', {}, r.agent)), el('td', {}, r.unit));
    const rt = el('td');
    if (DATA.codex) {
      const sel = select(`runtime-${i}`, ['claude', 'codex'], s.runtime);
      sel.setAttribute('aria-label', `${r.agent} ${r.unit} 런타임`);
      sel.onchange = () => {
        s.runtime = sel.value;
        // claude keeps only a model from its list; codex starts from an empty box the user fills
        if (s.runtime === 'codex') s.model = '';
        else if (!DATA.models.includes(s.model)) s.model = DATA.models[0];
        if (noEffort(s)) s.effort = '';
        change(sel.id);
      };
      rt.append(sel);
    } else rt.textContent = s.runtime;
    const md = el('td');
    let model;
    if (s.runtime === 'codex') {
      model = el('input', { type: 'text', id: `model-${i}`, value: s.model, className: 'mono' });
      model.oninput = () => { s.model = model.value.trim(); touched = true; };
      // Codex's own model list as suggestions; any other ID can still be typed
      model.setAttribute('list', 'codex-models');
    } else {
      model = select(`model-${i}`, DATA.models, s.model);
      model.onchange = () => { s.model = model.value; if (noEffort(s)) s.effort = ''; change(model.id); };
    }
    model.setAttribute('aria-label', `${r.agent} ${r.unit} model`);
    md.append(model);
    const ef = select(`effort-${i}`, ['', ...DATA.efforts], s.effort, { '': '(없음)' });
    ef.setAttribute('aria-label', `${r.agent} ${r.unit} effort`);
    ef.disabled = noEffort(s);
    ef.onchange = () => { s.effort = ef.value; change(ef.id); };
    const recTd = el('td'), line = el('div', { className: 'rec' });
    if (r.isNew) {
      line.append(el('span', { className: 'pill new' }, '새 팀'));
    } else {
      line.append(el('span', { className: 'pill' }, '지금 값 유지'));
      if (r.recommend) {
        line.append(el('span', {}, recText(r.recommend)));
        const b = el('button', { type: 'button', id: `rec-${i}` }, '추천값으로');
        b.onclick = () => { s.model = r.recommend.model; s.effort = noEffort(s) ? '' : r.recommend.effort; change(b.id); };
        line.append(b);
      }
    }
    recTd.append(line);
    if (r.recommend && r.recommend.reason) recTd.append(el('div', { className: 'reason' }, r.recommend.reason));
    tr.append(rt, md, td(ef), recTd);
    body.append(tr);
  });
}
// the table is drawn again, so focus goes back to the control the user just changed
function change(id) { touched = true; render(); document.getElementById(id)?.focus(); }

const choices = () => DATA.rows.map((r, i) => ({ agent: r.agent, unit: r.unit, runtime: state[i].runtime, model: state[i].model, effort: state[i].effort }));

async function save() {
  const status = document.getElementById('status'), fallback = document.getElementById('fallback');
  const button = document.getElementById('save');
  const empty = DATA.rows.findIndex((r, i) => state[i].runtime === 'codex' && !state[i].model);
  if (empty >= 0) {
    status.className = 'err';
    status.textContent = `${DATA.rows[empty].agent} (${DATA.rows[empty].unit}) 줄은 codex라 model을 직접 적어야 합니다. 적은 뒤 다시 저장하세요.`;
    document.getElementById(`model-${empty}`).focus();
    return;
  }
  button.disabled = true;
  status.className = '';
  status.textContent = '저장하는 중…';
  try {
    const db = await dbReady;
    if (!db) throw new Error('이 화면에서는 저장소를 쓸 수 없습니다');
    await db.doc(`${COLLECTION}/${DOC_ID}`).set({ savedAt: new Date().toISOString(), choices: choices() });
    status.className = 'ok';
    status.textContent = "저장됨. 채팅으로 돌아가 '저장했다'고 알려 주세요";
    fallback.hidden = true;
  } catch (e) {
    status.className = 'err';
    status.textContent = `저장하지 못했습니다(${(e && (e.message || e.code)) || e}). 아래 내용을 복사해 채팅에 붙여 넣어 주세요.`;
    document.getElementById('json').value = JSON.stringify(choices(), null, 2);
    fallback.hidden = false;
  } finally {
    button.disabled = false;
  }
}

async function copy() {
  const box = document.getElementById('json'), note = document.getElementById('copied');
  try { await navigator.clipboard.writeText(box.value); note.textContent = '복사됨'; }
  catch { box.focus(); box.select(); note.textContent = '선택해 두었습니다. Ctrl+C로 복사하세요'; }
}

// a value saved earlier fills the rows again, unless the viewer has already changed something
async function loadSaved() {
  try {
    const db = await dbReady;
    if (!db) return;
    const snap = await db.doc(`${COLLECTION}/${DOC_ID}`).get();
    const saved = snap.exists && snap.data().choices;
    if (!Array.isArray(saved) || touched) return;
    for (const c of saved) {
      const i = DATA.rows.findIndex((r) => r.agent === c.agent && r.unit === c.unit);
      if (i >= 0) state[i] = { runtime: c.runtime ?? state[i].runtime, model: c.model ?? state[i].model, effort: c.effort ?? state[i].effort };
    }
    render();
  } catch { /* the page keeps its initial values */ }
}

document.getElementById('save').onclick = save;
document.getElementById('copy').onclick = copy;
render();
loadSaved();
</script>
